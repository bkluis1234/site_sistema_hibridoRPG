# Somente desenvolvimento. Produção usa MySQL gerenciado externo ao Render.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hibrido
      MYSQL_USER: hibrido
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_dev_data:
